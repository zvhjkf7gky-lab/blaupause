<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globaler Logistik-Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logistik-Tycoon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed HUD on top, one scrolling "bay" in the middle, dock-style tab bar at the bottom (side rail on tablets). */
:root{
  --bg:#0a1424; --panel:#112038; --panel2:#182c49; --line:#24406a; --ink:#eef3fa; --mute:#8ea4c2;
  --orange:#ff7a1a; --orange2:#ffa452; --teal:#2e8c88; --good:#38cc8c; --warn:#ffc23d; --bad:#ff5d61;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.hud{flex:none;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#0d1b31,#0b1729);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.lvl{position:relative;width:44px;height:44px;flex:none}
.lvl svg{position:absolute;inset:0}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:19px;font-weight:800}
.co{min-width:0;overflow:hidden}
.co .nm{font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.co .st{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .sp{display:none}
.cash{text-align:right;flex:none;max-width:62vw}
.cash .m{font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1}
.cash .d{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.daybar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.daybar i{display:block;height:100%;background:var(--orange)}
.body{flex:1;display:flex;min-height:0}
.rail{display:none}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
nav.tabs{flex:none;display:flex;background:#0c182b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;position:relative;cursor:pointer;min-height:54px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--orange)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px #0c182b}
@media (min-width:880px){
  nav.tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:2px;width:92px;flex:none;border-right:1px solid var(--line);background:#0c182b;padding:10px 6px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));overflow-y:auto}
  .rail .tab{flex:none;min-height:62px;border-radius:12px}
  .rail .tab.on{background:#14284a}
}
h2{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0;display:flex;align-items:center;gap:8px}
h2 .cnt{color:var(--ink);font-variant-numeric:tabular-nums}
h1{font-family:var(--f-disp);font-weight:800;font-size:30px;letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:980px){.cols{grid-template-columns:1fr 1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.hot{border-color:var(--orange)}
.card.dim{opacity:.55}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.sb{justify-content:space-between;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--orange2)}
.ico svg{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--panel2);color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip svg{width:12px;height:12px}
.chip.o{background:rgba(255,122,26,.16);color:var(--orange2)}
.chip.c{background:rgba(74,163,255,.16);color:#8cc6ff}
.chip.g{background:rgba(56,204,140,.15);color:var(--good)}
.chip.r{background:rgba(255,93,97,.15);color:var(--bad)}
.chip.y{background:rgba(255,194,61,.15);color:var(--warn)}
.btn{appearance:none;border:0;border-radius:11px;padding:10px 14px;min-height:42px;font-weight:700;font-size:14px;background:var(--orange);color:#1a0d02;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;touch-action:manipulation;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{background:#2a3b57;color:#7488a5;cursor:default;transform:none}
.btn.s{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.s:disabled{color:#5f7393}
.btn.g{background:var(--good);color:#04210f}
.btn.r{background:transparent;color:var(--bad);border:1px solid rgba(255,93,97,.4)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:9px}
.btn.w{width:100%}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--orange2);outline-offset:2px}
.bar{height:7px;border-radius:4px;background:#0b1830;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:4px;transition:width .2s linear}
.bar.t i{background:var(--teal)} .bar.g i{background:var(--good)} .bar.r i{background:var(--bad)} .bar.y i{background:var(--warn)} .bar.w i{background:#cfd9e6}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:6px;border-radius:2px;background:#25385a}
.pips i.on{background:var(--orange)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mute);white-space:nowrap;cursor:pointer;min-height:36px}
.seg button.on{background:var(--panel2);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.kpi .l{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-family:var(--f-disp);font-weight:800;font-size:clamp(18px,5.2vw,24px);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere;line-height:1.1}
.empty{border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--mute);font-size:14px;text-align:center}
/* scene */
.scene{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#2f4a3e;height:clamp(230px,44vh,440px)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .ov{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.pill{background:rgba(9,18,34,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pill svg{width:14px;height:14px;color:var(--orange2)}
.scene .act{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.scene .lbl{position:absolute;left:12px;bottom:12px;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
/* map */
.map{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0c2440;height:clamp(300px,56vh,560px);touch-action:none}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.map .ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.map .pre{position:absolute;left:10px;bottom:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.map .pre .btn{background:rgba(9,18,34,.85);color:var(--ink);border:1px solid var(--line)}
.map.big{height:calc(100dvh - 230px)}
.leg{margin-top:-6px}
.leg span{font-size:11.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:7px;display:flex;gap:5px;align-items:center}
.leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.card.dark{background:linear-gradient(140deg,#1d1236,#120b22);border-color:#3d2a63}
.map .pre .btn.on{border-color:var(--orange);color:var(--orange2)}
/* tutorial */
.tip{background:linear-gradient(120deg,#1c3157,#14284a);border:1px solid #2d4f86;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.tip .n{font-family:var(--f-disp);font-weight:800;font-size:28px;color:var(--orange);line-height:1;flex:none;width:28px;text-align:center}
/* overlays */
.ovl{position:fixed;inset:0;z-index:20;background:rgba(3,8,18,.62);display:flex;align-items:flex-end;justify-content:center;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);animation:fade .18s ease}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;padding:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s cubic-bezier(.2,.9,.3,1)}
@media (min-width:700px){.ovl{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line);padding-bottom:18px}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-top:-6px}
.sheet p{margin:0;line-height:1.45;color:#c9d5e6}
.choice{display:flex;flex-direction:column;gap:8px}
.choice .btn{justify-content:flex-start;text-align:left;white-space:normal;padding:12px 14px}
.choice .btn small{display:block;font-weight:500;opacity:.8;font-size:12.5px}
textarea{width:100%;min-height:110px;background:#0b1830;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
input[type=text]{width:100%;background:#0b1830;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{background:rgba(14,28,52,.96);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tin .25s ease;width:100%}
.toast.g{border-left-color:var(--good)} .toast.r{border-left-color:var(--bad)} .toast.y{border-left-color:var(--warn)}
.float{position:fixed;z-index:25;pointer-events:none;font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--good);text-shadow:0 2px 6px rgba(0,0,0,.5);animation:flt 1.3s ease-out forwards}
.flash{animation:flash .6s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
@keyframes flt{to{transform:translateY(-38px);opacity:0}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,122,26,.8)}100%{box-shadow:0 0 0 14px rgba(255,122,26,0)}}
.stage-banner{border-radius:16px;padding:14px;background:radial-gradient(120% 140% at 0% 0%,#24477c,#112038);border:1px solid #2d4f86}
.steps{display:flex;gap:4px;margin-top:10px}
.steps i{flex:1;height:6px;border-radius:3px;background:#26406a}
.steps i.on{background:var(--orange)}
.tree{display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column;gap:8px}
.lb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.lb.me{border-color:var(--orange);background:#1d2c46}
.lb .rk{font-family:var(--f-disp);font-weight:800;font-size:20px;width:26px;color:var(--mute)}
.lb.me .rk{color:var(--orange)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td{padding:6px 0;border-bottom:1px solid var(--line)}
table.t td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;cursor:pointer;position:relative;text-align:left;min-height:110px}
.tile svg{width:28px;height:28px;color:var(--orange2)}
.tile b{font-family:var(--f-disp);font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.tile .dot{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--orange)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud"></header>
  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main id="main"><div class="view" id="view"></div></main>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="overlay"></div>
<div class="toasts" id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   GLOBALER LOGISTIK-TYCOON
   Sections: helpers · data · state · economy · simulation · events ·
             missions · scene renderer · map renderer · UI · input · boot
   ===================================================================== */

/* ---------- helpers ---------- */
const DAY = 60;                       // seconds per game day
const SAVE_KEY = 'glt-save-v1';
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nf = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 });
const cf = new Intl.NumberFormat('de-DE', { notation: 'compact', maximumFractionDigits: 1 });
function money(v) { const a = Math.abs(v); return (v < -0.5 ? '−' : '') + (a >= 1e6 ? cf.format(a) : nf.format(Math.round(a))) + ' €'; }
function num(v) { return Math.abs(v) >= 1e6 ? cf.format(v) : nf.format(Math.round(v)); }
function dur(s) { s = Math.max(0, Math.ceil(s)); if (s < 60) return s + ' s'; const m = Math.floor(s / 60); if (m < 60) return m + ':' + String(s % 60).padStart(2, '0') + ' min'; return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function wpick(items, wf) { let tot = 0; for (const i of items) tot += wf(i); let r = Math.random() * tot; for (const i of items) { r -= wf(i); if (r <= 0) return i; } return items[items.length - 1]; }
function km(a, b) { const R = 6371, t = Math.PI / 180; const dLat = (b.lat - a.lat) * t, dLon = (b.lon - a.lon) * t; const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }

const I = {
  home: '<path d="M3 21V9l9-5 9 5v12"/><path d="M7 21v-7h10v7M7 17.5h10"/>',
  box: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  truck: '<path d="M2 6h11v10H2zM13 9h4.5l3.5 4v3h-8z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  van: '<path d="M2 7h12l4 4h3v6H2z"/><path d="M14 7v4h4"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/>',
  plane: '<path d="M2 13.5 9 12l4-8h2l-1.5 8 6.5-.5 1.5-2.5h1.5l-1 4 1 4H21.5L20 14.5l-6.5-.5L15 22h-2l-4-8-7-1.5z"/>',
  ship: '<path d="M3 15h18l-2.5 5h-13z"/><path d="M6 15V9h12v6M9 9V5h6v4"/>',
  train: '<rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14M9 20l-2 2M15 20l2 2M8 16l-1 4h10l-1-4"/>',
  drone: '<circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><path d="M7 7l3 3h4l3-3M10 10v5h4v-5M9 19h6"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 4.6a3 3 0 0 1 0 6M18.5 14.2c1.6.8 2.5 2.9 2.5 5.8"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.4 3.2 14.6 0 18M12 3c-3.2 3.4-3.2 14.6 0 18"/>',
  flask: '<path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3M7.2 15h9.6"/>',
  chart: '<path d="M4 20V11M10 20V5M16 20v-6M3 20h18"/>',

  const st = stage(); const out = [];
  const cities = Object.keys(S.markets);
  const types = CTYPES.filter(t => S.rep + 15 >= t.rep);
  for (let i = 0; i < 3; i++) {
    const ct = pick(types); const city = pick(cities); const tier = orderTier(city), geo = geoTier(city);
    const [a, b] = SIZE[geo];
    const per = Math.round(rnd(a, b) * ct.size * rnd(1, 1.8) * (1 + st * .15));
    const days = rint(3, 4 + st);
    const cold = has('cold') && ct.cold && Math.random() < .3;
    const rate = RATE[geo] * 1.15 * (cold ? 1.45 : 1) * (tier < geo ? .75 : 1);
    out.push({ id: nid('k'), cust: custName(ct.id), ct: ct.id, city, per, days, tier, geo, cold, rate, bonus: Math.round(per * days * rate * .35 * payMult()), penalty: Math.round(per * days * rate * .2), minRep: ct.rep });
  }
  S.contracts.offers = out; S.contracts.refresh = S.day + 3;
}
function contractLimit() { return 1 + stage(); }
function acceptContract(id) {
  const k = S.contracts.offers.find(o => o.id === id); if (!k) return;
  if (S.contracts.active.length >= contractLimit()) return toast(`Maximal ${contractLimit()} Verträge gleichzeitig in dieser Stufe.`, 'y');
  if (S.rep < k.minRep) return toast(`Dafür brauchst du ${k.minRep} Ruf.`, 'y');
  S.contracts.offers = S.contracts.offers.filter(o => o !== k);
  Object.assign(k, { daysLeft: k.days, total: 0, done: 0, late: 0, failed: 0 });
  S.contracts.active.push(k);
  k.daysLeft--; spawnContractOrder(k);
  toast(`Vertrag mit ${k.cust} unterschrieben.`, 'g');
}
function spawnContractOrder(c) {
  const o = genOrder({ city: c.city, ct: c.ct, pk: c.per, cold: c.cold, express: false, contract: c.id });
  o.pay = Math.round((BASE[c.geo || o.tier] + c.per * c.rate) * payMult());
  o.win = Math.max(o.win * 1.3, DAY * 1.5);
  c.total++;
  if (canStore(o.pk)) { admit(o); }
  else { c.failed++; toast(`Vertrag ${c.cust}: Tageslieferung verpasst – Lager voll.`, 'r'); addRep(-1); }
}
function settleContract(c) {
  S.contracts.active = S.contracts.active.filter(x => x !== c);
  const bad = (c.late + c.failed) / Math.max(1, c.total);
  if (bad <= .2) { earn(c.bonus); addRep(4); S.stats.contracts++; addXp(c.bonus / 20); toast(`Vertrag erfüllt! Bonus ${money(c.bonus)} von ${c.cust}.`, 'g'); }
  else { spend(c.penalty, 'other'); addRep(-5); toast(`Vertrag mit ${c.cust} nicht erfüllt. Vertragsstrafe ${money(c.penalty)}.`, 'r'); }
}

/* ---------- staff ---------- */
function genCand(role) {
  const lvl = wpick([1, 2, 3], l => [0, 6, 3, 1][l]);
  const salary = Math.round(ROLES[role].base * (1 + .35 * (lvl - 1)) * rnd(.9, 1.15) * (1 + (stage() - 1) * .15));
  return { id: nid('c'), role, name: pick(FIRST) + ' ' + pick(LAST), lvl, salary, xp: 0 };
}
function candidates(role) { if (!S.cand[role]) S.cand[role] = [genCand(role), genCand(role), genCand(role)]; return S.cand[role]; }
function hireFee(c) { return c.salary * 2; }
function hire(cid, role) {
  const list = candidates(role); const c = list.find(x => x.id === cid); if (!c) return;
  if (stage() < ROLES[role].st) return toast(`${ROLES[role].pl} gibt es ab Stufe ${ROLES[role].st}.`, 'y');
  if (role === 'worker' && staffOf('worker').length >= workerSlots()) return toast('Keine freien Arbeitsplätze. Vergrößere die Halle.', 'y');
  if (!tryBuy(hireFee(c), c.name)) return;
  S.cand[role] = list.filter(x => x !== c);
  const e = { id: nid('e'), role, name: c.name, lvl: c.lvl, xp: 0, salary: c.salary };
  S.staff.push(e); S.stats.hires++;
  if (role === 'driver') { const v = S.vehicles.find(v => needsDriver(v) && !driverOf(v)); if (v) v.driver = e.id; }
  toast(`${c.name} eingestellt (${ROLES[role].n}).`, 'g');
}
function freeDrivers() { const used = new Set(S.vehicles.map(v => v.driver)); return staffOf('driver').filter(d => !used.has(d.id)); }
function fire(id) {
  const e = S.staff.find(x => x.id === id); if (!e || e.founder) return;
  const v = S.vehicles.find(v => v.driver === id);
  if (v && v.state !== 'idle') return toast(`${e.name} ist gerade unterwegs.`, 'y');
  if (v) v.driver = null;
  S.staff = S.staff.filter(x => x !== e);
  spend(e.salary, 'salary');
  toast(`${e.name} wurde entlassen (Abfindung ${money(e.salary)}).`);
}
function train(id) { const e = S.staff.find(x => x.id === id); if (!e || e.lvl >= 5) return; const c = Math.round(Math.max(150, e.salary) * 3); if (!tryBuy(c, 'die Schulung')) return; e.xp = Math.min(staffNeed(e), e.xp + staffNeed(e) * .5); toast(`${e.name} hat eine Schulung abgeschlossen.`, 'g'); }
function promote(id) {
  const e = S.staff.find(x => x.id === id); if (!e || e.lvl >= 5 || e.xp < staffNeed(e)) return;
  const c = Math.round(Math.max(200, e.salary) * 4); if (!tryBuy(c, 'die Beförderung')) return;
  e.lvl++; e.xp = 0; if (!e.founder) e.salary = Math.round(e.salary * 1.3);
  toast(`${e.name} befördert auf Stufe ${e.lvl}.`, 'g');
}

/* ---------- vehicles ---------- */
function buyVehicle(type) {
  const t = VT[type];
  if (stage() < t.st) return toast(`${t.n} ab Stufe ${t.st}.`, 'y');
  if (t.req && !has(t.req)) return toast(`Erforsche zuerst „${RS[t.req].n}“.`, 'y');
  if (t.mod && S.vehicles.filter(v => v.type === type).length >= typeLimit(type)) return toast(`Baue zuerst ${MODS[t.mod].n} aus.`, 'y');
  if (!t.nopark && parkUsed() >= parkSlots()) return toast('Kein Stellplatz frei. Baue den Parkplatz aus.', 'y');
  if (!tryBuy(t.price, t.n)) return;
  const n = S.vehicles.filter(v => v.type === type).length + 1;
  const v = { id: nid('v'), type, name: `${t.n} ${n}`, cond: 100, up: { spd: 0, cap: 0 }, driver: null, state: 'idle' };
  if (needsDriver(v)) { const d = freeDrivers()[0]; if (d) v.driver = d.id; }
  S.vehicles.push(v);
  toast(`${t.n} gekauft.${needsDriver(v) && !v.driver ? ' Stelle einen Fahrer ein.' : ''}`, 'g');
}
function sellVehicle(id) {
  const v = S.vehicles.find(x => x.id === id); if (!v) return;
  if (v.state !== 'idle') return toast('Fahrzeug ist unterwegs.', 'y');
  if (S.vehicles.length <= 1) return toast('Dein letztes Fahrzeug kannst du nicht verkaufen.', 'y');
  const val = Math.round(vValue(v)); S.money += val;
  S.vehicles = S.vehicles.filter(x => x !== v); U.modal = null;
  toast(`${v.name} für ${money(val)} verkauft.`);
}
function repair(id) { const v = S.vehicles.find(x => x.id === id); if (!v || v.state !== 'idle' || v.cond >= 99.5) return; const c = repairCost(v); if (S.money < c) return toast('Zu wenig Geld für die Reparatur.', 'r'); spend(c, 'repair'); v.cond = 100; toast(`${v.name} repariert.`, 'g'); }
function upgradeVehicle(id, k) { const v = S.vehicles.find(x => x.id === id); if (!v || v.up[k] >= 3) return; if (!tryBuy(vUpCost(v, k), 'das Upgrade')) return; v.up[k]++; toast(`${v.name}: ${k === 'spd' ? 'Motor' : 'Laderaum'} auf Stufe ${v.up[k]}.`, 'g'); }
function assignDriver(vid, did) {
  const v = S.vehicles.find(x => x.id === vid); if (!v) return;
  const other = S.vehicles.find(x => x.driver === did);
  if (other && other.state !== 'idle') return toast('Dieser Fahrer ist gerade unterwegs.', 'y');
  if (v.state !== 'idle') return toast('Fahrzeug ist unterwegs.', 'y');
  if (other) other.driver = null;
  v.driver = did; toast('Fahrer zugewiesen.', 'g');
}

/* ---------- warehouses & map ---------- */
function modLocked(k, w) {
  const d = MODS[k];
  if (d.req && !has(d.req)) return `Forschung: ${RS[d.req].n}`;
  if (d.coast && !CITY[w.city].coast) return 'Nur an Küstenstädten';
  if (k === 'docks' && w.m.docks >= w.m.size + 1) return 'Größere Halle nötig';
  return null;
}
function upgradeMod(wi, k) {
  const w = S.warehouses[wi]; const d = MODS[k];
  if (!w || w.m[k] >= d.max) return;
  const lock = modLocked(k, w); if (lock) return toast(lock, 'y');
  const c = modCost(k, w); if (!tryBuy(c, d.n)) return;
  w.m[k]++; w.inv += c;
  toast(`${d.n} auf Stufe ${w.m[k]} ausgebaut.`, 'g'); U.flash = k;
}
function cityLock(cid) {
  const c = CITY[cid];
  if (stage() < c.st) return `Ab Stufe ${c.st}: ${STAGES[c.st].n}`;
  return null;
}
function openMarket(cid) {
  const c = CITY[cid]; if (S.markets[cid]) return;
  const l = cityLock(cid); if (l) return toast(l, 'y');
  if (!tryBuy(MARKET_COST[c.st], `den Markt ${c.n}`)) return;
  S.markets[cid] = 1; addXp(MARKET_COST[c.st] / 30);
  toast(`Markt ${c.n} erschlossen. Neue Kunden melden sich.`, 'g');
}
function buildBranch(cid) {
  const c = CITY[cid]; if (S.branches[cid]) return;
  const l = cityLock(cid); if (l) return toast(l, 'y');
  if (!S.markets[cid]) return toast('Erschließe zuerst den Markt.', 'y');
  if (!tryBuy(BRANCH_COST[c.st], `die Niederlassung ${c.n}`)) return;
  S.branches[cid] = 1;
  S.warehouses.push({ id: nid('w'), city: cid, name: `Niederlassung ${c.n}`, m: { size: 1, shelves: 0, conv: 0, sorter: 0, docks: 1, park: 1, robot: 0, rail: 0, air: 0, port: 0, mega: 0 }, inv: BRANCH_COST[c.st] * .5 });
  addXp(BRANCH_COST[c.st] / 25);
  toast(`Niederlassung ${c.n} eröffnet. Lieferungen dort sind jetzt lokal.`, 'g');
}

/* ---------- research ---------- */
function researchState(r) {
  if (S.research.done[r.id]) return 'done';
  if (S.research.cur && S.research.cur.id === r.id) return 'cur';
  if (stage() < r.st) return 'stage';
  if (r.req.some(q => !S.research.done[q])) return 'req';
  return 'open';
}
function startResearch(id) {
  const r = RS[id]; if (researchState(r) !== 'open') return;
  if (S.research.cur) return toast('Es läuft bereits ein Forschungsprojekt.', 'y');
  if (!tryBuy(r.cost, r.n)) return;
  S.research.cur = { id, t: 0 }; toast(`Forschung gestartet: ${r.n}`);
}

/* ---------- finance ---------- */
function assetValue() { let v = 0; for (const x of S.vehicles) v += vValue(x); for (const w of S.warehouses) v += w.inv * .5 + 5000; for (const c in S.markets) v += MARKET_COST[CITY[c].st] * .5; for (const c in S.branches) v += BRANCH_COST[CITY[c].st] * .6; return v; }
function maxLoan() { return Math.max(10000, Math.round(assetValue() * .6 / 1000) * 1000); }
function takeLoan(a) { a = Math.min(a, maxLoan() - S.loan); if (a <= 0) return toast('Kreditrahmen ausgeschöpft.', 'y'); S.loan += a; S.money += a; toast(`Kredit über ${money(a)} aufgenommen. Zins 0,8 % pro Tag.`); }
function repay(a) { a = Math.min(a, S.loan, Math.max(0, S.money)); if (a <= 0) return toast('Nichts zu tilgen oder zu wenig Geld.', 'y'); S.loan -= a; S.money -= a; toast(`${money(a)} getilgt.`, 'g'); }
function rankList() { const me = { n: S.name, v: valuation(), me: 1 }; return [...S.rivals.filter(x => !x.gone).map(x => ({ n: RV[x.id].n, v: x.v, id: x.id })), me].sort((a, b) => b.v - a.v); }
function myRank() { return rankList().findIndex(x => x.me) + 1; }

function hashF(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; }

function sfx(n) {

  try {
    if (!SND.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; SND.ctx = new AC(); }
    const c = SND.ctx; if (c.state === 'suspended') c.resume();

/* ---------- autopilot ---------- */
const AP_KEYS = [['accept', 'Aufträge annehmen'], ['dispatch', 'Versenden'], ['care', 'Reparatur & Fahrer'], ['events', 'Ereignisse & Belohnungen'], ['research', 'Forschung'], ['build', 'Ausbau & Einkauf']];
function apReserve() { const h = S.fin.hist[S.fin.hist.length - 1]; return Math.max(400, h ? h.exp * .8 : 300); }
function apCan(c) { return S.money - c >= apReserve(); }
function apTypeOk(t) { const d = VT[t]; return stage() >= d.st && (!d.req || has(d.req)) && (!d.mod || S.vehicles.filter(v => v.type === t).length < typeLimit(t)) && (d.nopark || parkUsed() < parkSlots()); }
function apCheapest(o) { return Object.keys(VT).filter(t => apTypeOk(t) && canServe({ type: t, up: { spd: 0, cap: 0 } }, o)).sort((a, b) => VT[a].price - VT[b].price)[0]; }
function apHire(role, extraDays) { const c = candidates(role)[0]; if (!c) { if (S.money > 5000) S.cand[role] = null; return false; } if (!apCan(hireFee(c) + c.salary * extraDays)) return false; hire(c.id, role); return true; }
function apUpgrade(wi, k, mult = 1) { const w = S.warehouses[wi]; if (!w || w.m[k] >= MODS[k].max || modLocked(k, w)) return false; if (!apCan(modCost(k, w) * mult)) return false; upgradeMod(wi, k); return true; }
function autoEvent() {
  const c = S.ev.cur; if (!c) return;
  const ch = EVENTS[c.id].choices(c.p);
  let best = 0;
  // prefer paid options only when clearly affordable, accept missions when storage allows
  const costly = i => /Kostet/.test(ch[i].s);
  if (c.id === 'bigorder' || c.id === 'gov') best = c.p.o && canStore(c.p.o.pk) && S.vehicles.some(v => canServe(v, c.p.o)) ? 0 : 1;
  else if (c.id === 'pricewar') best = apCan(c.p.cost * 3) ? 1 : 0;
  else if (c.id === 'rival_push') best = apCan(c.p.cost * 2) ? 0 : 2;
  else if (c.id === 'sabotage' || c.id === 'tipoff') best = apCan(c.p.cost * 2) ? 0 : 1;
  else if (c.id === 'steal') best = 0;
  else if (c.id === 'hostile') best = apCan(c.p.cost * 1.5) ? 0 : 1;
  else if (c.id === 'poach') best = apCan(c.p.cost * 30) ? 0 : 1;
  else { best = ch.findIndex((x, i) => costly(i)); if (best < 0 || !apCan((c.p.cost || 0) * 3)) best = ch.findIndex((x, i) => !costly(i)); if (best < 0) best = 0; }
  toast(`${EVENTS[c.id].title}: Autopilot wählt „${ch[best].t}“`, 'y', !!EVENTS[c.id].rival);
  resolveEvent(best);
}
function autopilot() {
  U.quiet = true;
  try { autopilotRun(); } finally { U.quiet = false; }
}
function autopilotRun() {
  const A = S.auto; if (!A) return;
  if (A.events) {
    if (S.ev.cur) { autoEvent(); }
    ensureMissions();
    for (const k of ['daily', 'weekly']) (S.missions[k] || []).forEach((m, i) => { if (!m.claimed && mProg(m) >= m.n) claimMission(k, i); });
    for (const a of ACH) if (!S.ach[a.id] && a.v() >= a.g) claimAch(a.id);
  }
  if (A.accept) {
    let q = S.orders.filter(o => o.state === 'sort').reduce((a, o) => a + o.sortLeft, 0);
    const sr = sortRate();
    const waitingReady = S.orders.filter(o => o.state === 'ready' && o.left > 0 && !bestVehicle(o)).length;
    for (const o of S.board.slice().sort((a, b) => b.pay / b.pk - a.pay / a.pk)) {
      if (waitingReady > Math.max(1, S.vehicles.length / 3)) break;
      if (!canStore(o.pk) || !S.vehicles.some(v => canServe(v, o))) continue;
      if ((q + o.pk) / sr < o.win * .45 && stored() + o.pk <= capacity() * .9) { if (acceptOrder(o.id, true)) q += o.pk; }
    }
    if (S.contracts.active.length < contractLimit()) {
      const k = S.contracts.offers.find(k => S.rep >= k.minRep && capacity() - stored() > k.per * 2 && S.vehicles.some(v => canServe(v, { tier: k.tier, cold: k.cold, city: k.city })));
      if (k) acceptContract(k.id);
    }
  }
  if (A.dispatch) {
    for (const o of S.orders.slice().sort((a, b) => a.deadline - b.deadline)) if (o.state === 'ready') { let n = 0; while (o.left > 0 && n++ < 20 && dispatch(o, null, true)); }
    for (const o of S.orders.slice()) if (o.late && o.left === o.pk && o.state === 'ready' && !S.vehicles.some(v => canServe(v, o))) cancelOrder(o.id);
  }
  if (A.care) {
    for (const v of S.vehicles) if (v.state === 'idle' && v.cond < 40 && apCan(repairCost(v))) repair(v.id);
    for (const v of S.vehicles) if (needsDriver(v) && !driverOf(v)) { const d = freeDrivers()[0]; if (d) v.driver = d.id; else apHire('driver', 2); }
  }
  if (A.research && !S.research.cur) {
    const r = RESEARCH.filter(r => researchState(r) === 'open').sort((a, b) => (a.id === 'customs' ? -1 : 0) - (b.id === 'customs' ? -1 : 0) || a.cost - b.cost)[0];
    if (r && apCan(r.cost * 1.3)) startResearch(r.id);
  }
  if (A.build) autoBuild();
  if (S.money < 0 && S.loan < maxLoan()) takeLoan(Math.max(2000, Math.round(-S.money * 1.5)));
  if (S.loan > 0 && S.money > S.loan * 2 + apReserve()) repay(S.loan);
}
function autoBuild() {
  const sr = sortRate();
  const sortQ = S.orders.filter(o => o.state === 'sort').reduce((a, o) => a + o.sortLeft, 0);
  // 1) vehicles: waiting ready orders without a free vehicle, or board orders nobody can serve
  const waiting = S.orders.filter(o => o.state === 'ready' && o.left > 0).sort((a, b) => a.deadline - b.deadline);
  const stuck = waiting.find(o => !bestVehicle(o)) || S.board.find(o => !S.vehicles.some(v => canServe(v, o)));
  if (stuck) {
    const t = apCheapest(stuck);
    if (t && apCan(VT[t].price)) { buyVehicle(t); return; }
    if (!t && parkUsed() >= parkSlots()) { for (let i = 0; i < S.warehouses.length; i++) if (apUpgrade(i, 'park')) return; }
  }
  // 2) sorting bottleneck
  if (sortQ / sr > 12) {
    if (staffOf('worker').length < workerSlots()) { if (apHire('worker', 4)) return; }
    else { for (const k of ['conv', 'sorter', 'robot', 'size']) if (apUpgrade(0, k)) return; }
  }
  // 3) storage
  if (stored() > capacity() * .7 || S.board.some(o => !canStore(o.pk))) { for (const k of ['shelves', 'size']) for (let i = 0; i < S.warehouses.length; i++) if (apUpgrade(i, k)) return; }
  if (S.trips.some(t => t.phase === 'queue')) { for (let i = 0; i < S.warehouses.length; i++) if (apUpgrade(i, 'docks')) return; }
  if (parkUsed() >= parkSlots() - 1) { if (apUpgrade(0, 'park', 1.5)) return; }
  // 4) terminals for new transport modes
  for (const k of ['rail', 'air', 'port']) { const wi = S.warehouses.findIndex(w => !modLocked(k, w)); if (wi >= 0 && !modSum(k) && apUpgrade(wi, k, 1.2)) return; }
  if (S.warehouses[0].m.robot === 0 && has('robotics') && apUpgrade(0, 'robot', 2)) return;
  if (has('megahub') && !S.warehouses[0].m.mega && apUpgrade(0, 'mega', 1.5)) return;
  // 5) automation staff
  if (S.vehicles.length >= 3 && staffOf('dispatcher').length < Math.ceil(S.vehicles.length / 10) && apHire('dispatcher', 10)) return;
  if (stage() >= 2 && staffOf('mechanic').length < Math.floor(S.vehicles.length / 8) && apHire('mechanic', 10)) return;
  if (stage() >= 2 && staffOf('manager').length < 1 + Math.floor(stage() / 3) && apHire('manager', 12)) return;
  if (stage() >= 3 && staffOf('specialist').length < stage() - 1 && apHire('specialist', 15)) return;
  // 6) expansion: new markets, then branches
  const open = CITIES.filter(c => !S.markets[c.id] && !cityLock(c.id)).sort((a, b) => MARKET_COST[a.st] - MARKET_COST[b.st])[0];
  if (open && apCan(MARKET_COST[open.st] * 2)) { openMarket(open.id); return; }
  const br = CITIES.filter(c => S.markets[c.id] && !S.branches[c.id] && !cityLock(c.id)).sort((a, b) => BRANCH_COST[a.st] - BRANCH_COST[b.st])[0];
  if (br && apCan(BRANCH_COST[br.st] * 4)) { buildBranch(br.id); return; }
  // 7) spare money: make the fleet better
  const old = S.vehicles.filter(v => v.state === 'idle' && v.up.cap < 3).sort((a, b) => vUpCost(a, 'cap') - vUpCost(b, 'cap'))[0];
  if (old && apCan(vUpCost(old, 'cap') * 6)) upgradeVehicle(old.id, 'cap');
}

function tutorial() {
  const steps = [

    ['Pakete sortieren', 'Dein Lager sortiert automatisch. Mit „Mit anpacken“ geht es schneller.', () => S.orders.some(o => o.state !== 'sort') || S.stats.orders > 0],

    ['Baue dein Lager aus', 'Im Lager-Bereich Regale kaufen: mehr Platz für gleichzeitige Aufträge.', () => S.warehouses[0].m.shelves > 0],

  ];
  while (S.tut < steps.length && steps[S.tut][2]()) S.tut++;

}

function vFinance() {
  const L = S.fin.today; const expT = Object.values(L.exp).reduce((a, b) => a + b, 0);
  const last = S.fin.hist[S.fin.hist.length - 1];
  const val = valuation();
  const H = S.fin.hist.slice(-14);
  let chart = '<div class="empty">Das Diagramm erscheint nach dem ersten abgeschlossenen Tag.</div>';
  if (H.length) {
    const Wc = 640, Hc = 220, pad = 34, bw = (Wc - pad - 8) / 14;
    const mx = Math.max(1, ...H.map(d => Math.max(d.rev, d.exp)));
    const mn = Math.min(0, ...H.map(d => d.profit));
    const y = v => 12 + (Hc - 40) * (1 - (v - mn) / (mx - mn));
    let s = '';
    for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4; s += `<line x1="${pad}" x2="${Wc - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#24406a" stroke-width="1"/><text x="${pad - 6}" y="${y(v) + 4}" fill="#8ea4c2" font-size="11" text-anchor="end">${esc(num(v))}</text>`; }
    H.forEach((d, i) => { const x = pad + 6 + i * bw; s += `<rect x="${x}" y="${y(d.rev)}" width="${bw * .38}" height="${Math.max(0, y(0) - y(d.rev))}" rx="2" fill="#ff7a1a"/><rect x="${x + bw * .4}" y="${y(d.exp)}" width="${bw * .38}" height="${Math.max(0, y(0) - y(d.exp))}" rx="2" fill="#4f6a92"/><text x="${x + bw * .39}" y="${Hc - 8}" fill="#8ea4c2" font-size="11" text-anchor="middle">${d.day}</text>`; });
    s += `<polyline fill="none" stroke="#eef3fa" stroke-width="2" points="${H.map((d, i) => `${pad + 6 + i * bw + bw * .39},${y(d.profit)}`).join(' ')}"/>`;
    H.forEach((d, i) => { s += `<circle cx="${pad + 6 + i * bw + bw * .39}" cy="${y(d.profit)}" r="${i === H.length - 1 ? 4 : 2.5}" fill="${d.profit >= 0 ? '#38cc8c' : '#ff5d61'}"/>`; });
    chart = `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="Umsatz, Kosten und Gewinn der letzten Tage">${s}</svg>`;
  }
  const br = last ? last.br : L.exp;
  const names = { salary: 'Gehälter', maint: 'Wartung', fuel: 'Kraftstoff & Energie', rent: 'Lagermiete', power: 'Strom', ins: 'Versicherung', repair: 'Reparaturen', interest: 'Kreditzinsen', tax: 'Steuern (15 % auf Gewinn)', prod: 'Rohstoffe für Produktion', fines: 'Strafen & Bestechung', other: 'Sonstiges' };
  const ml = maxLoan();
  return `<h1>Finanzen</h1>
  <div class="kpis">
    <div class="kpi"><div class="l">Kontostand</div><div class="v ${S.money < 0 ? 'neg' : ''}">${money(S.money)}</div></div>
    <div class="kpi"><div class="l">Unternehmenswert</div><div class="v">${money(val)}</div></div>
    <div class="kpi"><div class="l">Umsatz heute</div><div class="v">${money(L.rev)}</div></div>
    <div class="kpi"><div class="l">Kosten heute</div><div class="v">${money(expT)}</div></div>
    <div class="kpi"><div class="l">Gewinn gestern</div><div class="v ${last && last.profit < 0 ? 'neg' : 'pos'}">${last ? money(last.profit) : '–'}</div></div>
    <div class="kpi"><div class="l">Ruf</div><div class="v">${repStars()} / 5</div></div>
    <div class="kpi"><div class="l">Kraftstoffpreis</div><div class="v">${Math.round(S.fuel * fx('fuel') * 100)} %</div></div>
    <div class="kpi"><div class="l">Kredit</div><div class="v">${money(S.loan)}</div></div>
  </div>
  <section class="sec card chart"><div class="sech"><h2>Letzte 14 Tage</h2><div class="legend"><span><i style="background:#ff7a1a"></i>Umsatz</span><span><i style="background:#4f6a92"></i>Kosten</span><span><i style="background:#eef3fa"></i>Gewinn</span></div></div>${chart}</section>
  <div class="cols">
    <section class="sec card"><h2>${last ? `Kosten Tag ${last.day}` : 'Kosten heute (bisher)'}</h2><table class="t">${Object.keys(names).map(k => `<tr><td>${names[k]}</td><td>${money(br[k] || 0)}</td></tr>`).join('')}</table>
      <div class="sub">Laufend pro Tag: Gehälter ${money(S.staff.reduce((a, e) => a + e.salary, 0))}, Wartung ${money(S.vehicles.reduce((a, v) => a + VT[v.type].maint, 0) * (has('fleet') ? .85 : 1))}.</div></section>
    <section class="sec card"><h2>${ic('bank').replace('<svg', '<svg style="width:16px;height:16px"')} Bank</h2>

      <div class="row" style="flex-wrap:wrap;gap:6px">${[.1, .25, .5].map(f => btn('+' + money(Math.max(1000, Math.round(ml * f / 1000) * 1000)), 'loan', String(Math.max(1000, Math.round(ml * f / 1000) * 1000)), 's sm', S.loan >= ml)).join('')}</div>
      <div class="row" style="flex-wrap:wrap;gap:6px">${btn('Tilgen ' + money(Math.min(S.loan, Math.max(0, S.money))), 'repay', String(S.loan), 'sm', S.loan <= 0 || S.money <= 0)}</div>

      <table class="t"><tr><td>Voraussetzung</td><td>Stufe 5 oder 50 Mio. € Wert</td></tr><tr><td>Aktienpunkte jetzt</td><td>${sh}</td></tr></table>
      ${btn('Börsengang vorbereiten', 'ipo', '', '', !can || sh < 1)}</section>
    <section class="sec card"><h2>Spielstand</h2><div class="sub">Wird automatisch alle 10 Sekunden auf diesem Gerät gespeichert. Mit dem Code kannst du ihn auf ein anderes Gerät mitnehmen.</div>
      <div class="row" style="flex-wrap:wrap;gap:6px">${btn('Jetzt speichern', 'save', '', 's sm')}${btn('Code exportieren', 'export', '', 's sm')}${btn('Code laden', 'import', '', 's sm')}${btn('Neu beginnen', 'reset', '', 'r sm')}</div></section>
  </div>`;
}
function vMore() {
  return `<h1>Mehr</h1><div class="more">${TABS.filter(t => t.more).map(t => `<button class="tile" data-act="tab" data-a="${t.id}">${ic(t.ico)}<b>${t.n}</b>${tabDot(t.id) ? '<span class="dot"></span>' : ''}<span class="sub">${{ team: `${S.staff.length} Personen`, contracts: `${S.contracts.active.length} aktiv`, research: S.research.cur ? RS[S.research.cur.id].n : 'Kein Projekt', finance: money(valuation()) + ' Wert', goals: `${claimableCount()} abholbar`, rivals: `${Math.round(share('hh') * 100)} % in Hamburg`, prod: `${S.factories.length} ${S.factories.length === 1 ? 'Fabrik' : 'Fabriken'}`, under: stage() < 2 ? 'ab Stufe 2' : `Fahndung ${Math.round(S.heat)} %`, company: `${myRank()}. Platz weltweit` }[t.id]}</span></button>`).join('')}</div>`;
}

/* ---------- modals ---------- */
function renderModal() {
  const el = document.getElementById('overlay');
  const M = U.modal;
  if (!M && S.ev.cur) { U.modal = { type: 'event' }; return renderModal(); }
  if (!M) { if (el.innerHTML) { el.innerHTML = ''; el.dataset.type = ''; } return; }
  let body = '';
  if (M.type === 'event' && S.ev.cur) {
    const E = EVENTS[S.ev.cur.id]; const p = S.ev.cur.p;
    body = `<div class="row"><div class="ico">${ic('bolt')}</div><div class="grow"><div class="sub">Ereignis</div><div class="ttl" style="font-size:19px;white-space:normal">${E.title}</div></div></div><p>${esc(E.text(p))}</p><div class="choice">${E.choices(p).map((c, i) => `<button class="btn ${i ? 's' : ''}" data-act="evchoice" data-a="${i}">${esc(c.t)}<small>${esc(c.s)}</small></button>`).join('')}</div>`;
  } else if (M.type === 'event') { U.modal = null; return renderModal(); }
  else if (M.type === 'win') {
    body = `<div class="sub">Endkampf gewonnen</div><h1>Alleinherrscher</h1><p>Alle Konkurrenten gehören jetzt ${esc(S.name)}. Du kontrollierst die Logistik der Welt. Mit dem Börsengang kannst du mit dauerhaftem Bonus neu angreifen.</p>${btn('Zur Firma', 'win', '', 'w')}`;
  } else if (M.type === 'stage') {
    const s = STAGES[M.st];
    body = `<div class="sub">Neue Unternehmensstufe</div><h1>${M.st} · ${s.n}</h1><div class="steps">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= M.st ? 'on' : ''}"></i>`).join('')}</div><p>Freigeschaltet:</p><div class="chips">${s.unlock.map(u => `<span class="chip o">${esc(u)}</span>`).join('')}</div>${btn('Weiter', 'close', '', 'w')}`;
  } else if (M.type === 'offline') {
    body = `<div class="sub">Willkommen zurück</div><h1>${money(M.gain)}</h1><p>Während deiner Abwesenheit (${dur(M.el)}) hat dein Team mit ${Math.round(M.eff * 100)} % Effizienz weitergearbeitet.${M.rmsg ? ` Außerdem wurde „${esc(M.rmsg)}“ fertig erforscht.` : ''} Autopilot, Disponenten und Manager steigern die Offline-Erträge.</p>${btn('Weiter', 'close', '', 'w')}`;
  } else if (M.type === 'pickveh') {
    const o = S.orders.find(x => x.id === M.oid); if (!o || o.state !== 'ready') { U.modal = null; return renderModal(); }
    const list = S.vehicles.filter(v => canServe(v, o));
    body = `<div class="sub">Fahrzeug wählen</div><div class="ttl" style="font-size:18px">${esc(o.cust)} · ${num(o.left)} Pakete nach ${esc(CITY[o.city].n)}</div><div class="list">${list.map(v => { const ok = vReady(v); const tt = travelTime(v, o.dist, o.tier); return `<div class="card" data-key="pv-${v.id}"><div class="row"><div class="ico">${ic(VT[v.type].ico)}</div><div class="grow"><div class="ttl">${esc(v.name)}</div><div class="sub">${num(vCap(v))} Pakete · Hinfahrt ${dur(tt)} · Zustand ${Math.round(v.cond)} %</div></div>${btn('Wählen', 'dispatchv', o.id + ':' + v.id, 'sm', !ok)}</div></div>`; }).join('') || '<div class="empty">Kein passendes Fahrzeug.</div>'}</div>${btn('Abbrechen', 'close', '', 's w')}`;
  } else if (M.type === 'veh') {
    const v = S.vehicles.find(x => x.id === M.vid); if (!v) { U.modal = null; return renderModal(); }
    const t = VT[v.type]; const d = driverOf(v);
    const drivers = staffOf('driver');
    body = `<div class="row"><div class="ico">${ic(t.ico)}</div><div class="grow"><div class="ttl" style="font-size:19px">${esc(v.name)}</div><div class="sub">${t.n} · Wert ${money(vValue(v))}</div></div>${btn(ic('x'), 'close', '', 's sm', false, ' aria-label="Schließen"')}</div>
      <table class="t"><tr><td>Ladung</td><td>${num(vCap(v))} Pakete</td></tr><tr><td>Tempo</td><td>${Math.round(vSpeed(v))} km/h</td></tr><tr><td>Zustand</td><td>${Math.round(v.cond)} %</td></tr><tr><td>Wartung</td><td>${money(t.maint)} / Tag</td></tr></table>
      <h2>Upgrades</h2>
      <div class="row sb"><div><div class="ttl">Motor</div><div class="sub">+10 % Tempo je Stufe</div></div>${pips(v.up.spd, 3)}${v.up.spd < 3 ? btn(money(vUpCost(v, 'spd')), 'vup', v.id + ':spd', 'sm', S.money < vUpCost(v, 'spd')) : '<span class="chip g">Max</span>'}</div>
      <div class="row sb"><div><div class="ttl">Laderaum</div><div class="sub">+20 % Ladung je Stufe</div></div>${pips(v.up.cap, 3)}${v.up.cap < 3 ? btn(money(vUpCost(v, 'cap')), 'vup', v.id + ':cap', 'sm', S.money < vUpCost(v, 'cap')) : '<span class="chip g">Max</span>'}</div>
      ${needsDriver(v) ? `<h2>Fahrer</h2><div class="list">${drivers.map(e => { const on = S.vehicles.find(x => x.driver === e.id); return `<div class="row sb" data-key="dr-${e.id}"><div><div class="ttl">${esc(e.name)}</div><div class="sub">Stufe ${e.lvl} · ${on ? (on === v ? 'fährt dieses Fahrzeug' : 'fährt ' + esc(on.name)) : 'frei'}</div></div>${on === v ? '<span class="chip g">Zugewiesen</span>' : btn('Zuweisen', 'assign', v.id + ':' + e.id, 's sm')}</div>`; }).join('')}</div>${freeDrivers().length ? '' : `<div class="sub">Kein freier Fahrer. ${btn('Fahrer einstellen', 'gohire', 'driver', 'sm')}</div>`}` : '<div class="sub">Dieses Fahrzeug braucht keinen Fahrer.</div>'}
      ${btn('Verkaufen · ' + money(vValue(v)), 'sell', v.id, 'r w', v.state !== 'idle' || S.vehicles.length <= 1)}`;
  } else if (M.type === 'rename') {
    body = `<div class="ttl" style="font-size:18px">Firma umbenennen</div><input type="text" id="rename-input" maxlength="28" value="${esc(S.name)}" aria-label="Firmenname">${btn('Speichern', 'renameok', '', 'w')}${btn('Abbrechen', 'close', '', 's w')}`;
  } else if (M.type === 'export') {
    body = `<div class="ttl" style="font-size:18px">Spielstand-Code</div><p>Kopiere diesen Code und füge ihn auf einem anderen Gerät unter „Code laden“ ein.</p><textarea id="export-code" readonly>${esc(M.code)}</textarea>${btn('Kopieren', 'copy', '', 'w')}${btn('Schließen', 'close', '', 's w')}`;
  } else if (M.type === 'import') {
    body = `<div class="ttl" style="font-size:18px">Spielstand laden</div><p>Füge hier einen exportierten Code ein. Der aktuelle Spielstand wird ersetzt.</p><textarea id="import-code" aria-label="Spielstand-Code"></textarea>${btn('Laden', 'importok', '', 'w')}${btn('Abbrechen', 'close', '', 's w')}`;
  } else if (M.type === 'confirm') {
    body = `<div class="ttl" style="font-size:19px;white-space:normal">${esc(M.title)}</div><p>${esc(M.text)}</p>${btn(esc(M.ok), M.act, '', M.danger ? 'r w' : 'w')}${btn('Abbrechen', 'close', '', 's w')}`;
  }
  const html = `<div class="ovl" data-act="${M.type === 'event' ? '' : 'backdrop'}"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div></div>`;
  if (el.dataset.type !== M.type) { el.dataset.type = M.type; el.innerHTML = html; } else patch(el, html);
}

/* ---------- main render ---------- */
const VIEWS = { prod: vProd, under: vUnder, rivals: vRivals, hq: vHQ, wh: vWH, fleet: vFleet, team: vTeam, map: vMap, contracts: vContracts, research: vResearch, finance: vFinance, goals: vGoals, company: vCompany, more: vMore };
function render() {
  renderHUD(); renderNav();
  patch(document.getElementById('view'), (VIEWS[U.tab] || vHQ)());
  renderModal(); renderToasts();
  if (U.flash) setTimeout(() => { U.flash = null; }, 650);
}

/* ---------- input ---------- */
const ACT = {
  tab(a) { U.tab = a; U.modal = null; document.getElementById('main').scrollTop = 0; },
  sub(a) { const [k, v] = a.split(':'); U.sub[k] = v; },
  accept(a) { acceptOrder(a); },
  dispatch(a) { const o = S.orders.find(o => o.id === a); if (o) o.manual = 1; dispatch(o); },
  pickveh(a) { U.modal = { type: 'pickveh', oid: a }; },
  cancel(a) { const o = S.orders.find(x => x.id === a); if (o) U.modal = { type: 'confirm', title: 'Auftrag stornieren?', text: `${o.cust}: ${num(o.pk)} Pakete werden zurückgegeben. Gebühr ${money(cancelFee(o))}, Ruf −2.`, ok: 'Stornieren', act: 'cancelok', danger: 1, id: a }; },
  cancelok() { const id = U.modal && U.modal.id; U.modal = null; cancelOrder(id); },
  dispatchv(a) { const [o, v] = a.split(':'); if (dispatch(S.orders.find(x => x.id === o), v)) U.modal = null; },
  help() { if (U.helpCd > 0) return; const o = S.orders.find(o => o.state === 'sort'); if (!o) return; const n = Math.min(o.sortLeft, 3 + S.level * .5); o.sortLeft -= n; S.stats.sorted += n; if (o.sortLeft <= 1e-6) { o.sortLeft = 0; o.state = 'ready'; } U.helpCd = 1.2; },
  tutskip() { S.tut = 99; },
  auto(a) { if (a === 'all') { const on = !AP_KEYS.every(([k]) => S.auto[k]); for (const [k] of AP_KEYS) S.auto[k] = on ? 1 : 0; toast(on ? 'Autopilot komplett eingeschaltet.' : 'Autopilot ausgeschaltet. Du steuerst selbst.', on ? 'g' : ''); } else S.auto[a] = S.auto[a] ? 0 : 1; },
  speed(a) { S.speed = +a; },
  sound() { S.sound = S.sound ? 0 : 1; if (S.sound) sfx('cash'); },
  daily() { claimDaily(); },
  story() { claimStory(); },
  storyskip() { skipStory(); },
  defend(a) {},
  buildfac(a) { const [t, c] = a.split(':'); buildFactory(t, c); },
  upfac(a) { upgradeFactory(a); },
  factarget(a) { const [id, c] = a.split(':'); const f = S.factories.find(x => x.id === id); if (f) f.target = c; },
  smuggle(a) { acceptSmuggle(a); },
  bribe() { bribe(); },
  mapbig() { U.mapBig = !U.mapBig; },
  win() { U.modal = null; U.tab = 'company'; },
  campaign(a) { campaign(a); },
  pricewar(a) { priceWar(a); },
  takeover(a) { const x = S.rivals.find(r => r.id === a); if (x) U.modal = { type: 'confirm', title: `${RV[a].n} übernehmen?`, text: `Kaufpreis ${money(takeoverPrice(x))}. Ihre Kunden und Städte gehen an dich, der Konkurrent verschwindet.`, ok: 'Übernehmen', act: 'takeoverok', id: a }; },
  takeoverok() { const id = U.modal && U.modal.id; U.modal = null; takeover(id); },
  bid(a) { const [id, b] = a.split(':'); placeBid(id, b); },
  newsall() { U.newsAll = !U.newsAll; },
  selwh(a) { U.wh = +a; },
  mod(a) { const [w, k] = a.split(':'); upgradeMod(+w, k); },
  buyveh(a) { buyVehicle(a); },
  repair(a) { repair(a); },
  vehdetail(a) { U.modal = { type: 'veh', vid: a }; },
  vup(a) { const [v, k] = a.split(':'); upgradeVehicle(v, k); },
  assign(a) { const [v, d] = a.split(':'); assignDriver(v, d); },
  sell(a) { sellVehicle(a); },
  gohire(a) { U.modal = null; U.tab = 'team'; U.sub.team = 'hire'; },
  hire(a) { const [c, r] = a.split(':'); hire(c, r); },
  recruit() { const c = 150 + stage() * 200; if (!tryBuy(c, 'die Ausschreibung')) return; S.cand = {}; toast('Neue Bewerbungen sind eingegangen.', 'g'); },
  rolef(a) { U.roleF = a; },
  train(a) { train(a); }, promote(a) { promote(a); },
  fire(a) { const e = S.staff.find(x => x.id === a); if (e) U.modal = { type: 'confirm', title: `${e.name} entlassen?`, text: `Die Abfindung beträgt ein Tagesgehalt (${money(e.salary)}).`, ok: 'Entlassen', act: 'fireok', danger: 1, id: a }; },
  fireok() { const id = U.modal && U.modal.id; U.modal = null; fire(id); },
  city(a) { U.mapCity = a || null; if (a) { const c = CITY[a]; const [x, y] = merc(c.lon, c.lat); MAPV.x = x; MAPV.y = y; } },
  market(a) { openMarket(a); }, branch(a) { buildBranch(a); },
  zoom(a) { MAPV.z = clamp(MAPV.z * +a, 60, 40000); MAPV.preset = ''; },
  preset(a) { const cv = document.getElementById('map'); setPreset(a, cv ? cv.clientWidth : 360); },
  contract(a) { acceptContract(a); },
  research(a) { startResearch(a); },
  loan(a) { takeLoan(+a); }, repay(a) { repay(+a); },
  mission(a) { const [k, i] = a.split(':'); claimMission(k, +i); },
  ach(a) { claimAch(a); },
  evchoice(a) { resolveEvent(+a); },
  close() { U.modal = null; },
  backdrop(a, e) { if (e.target.classList.contains('ovl')) U.modal = null; },
  rename() { U.modal = { type: 'rename' }; },
  renameok() { const v = (document.getElementById('rename-input').value || '').trim(); if (v) S.name = v.slice(0, 28); U.modal = null; },
  save() { const ok = save(); toast(ok ? 'Gespeichert.' : 'Speichern ist in diesem Browser nicht möglich.', ok ? 'g' : 'r'); },
  export() { U.modal = { type: 'export', code: exportSave() }; },
  copy() { const ta = document.getElementById('export-code'); const txt = ta ? ta.value : ''; try { navigator.clipboard.writeText(txt).then(() => toast('Code kopiert.', 'g'), () => { ta.select(); toast('Code markiert – jetzt kopieren.'); }); } catch (e) { if (ta) ta.select(); } },
  import() { U.modal = { type: 'import' }; },
  importok() { importSave(document.getElementById('import-code').value || ''); },
  reset() { U.modal = { type: 'confirm', title: 'Wirklich neu beginnen?', text: 'Dein gesamter Fortschritt auf diesem Gerät wird gelöscht. Das lässt sich nicht rückgängig machen.', ok: 'Alles löschen und neu starten', act: 'resetok', danger: 1 }; },
  resetok() { newGame(); U.modal = null; U.tab = 'hq'; save(); toast('Neues Spiel gestartet.'); },
  ipo() { U.modal = { type: 'confirm', title: 'Börsengang durchführen?', text: `Du startest mit einer neuen Firma und erhältst ${prestigeShares()} Aktienpunkte (+${prestigeShares() * 2} % dauerhaft). Geld, Fahrzeuge, Lager und Forschung werden zurückgesetzt.`, ok: 'An die Börse gehen', act: 'ipook' }; },
  ipook() { doPrestige(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !b.dataset.act) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  U.userAct = true; sfx('click'); try { f(b.dataset.a || '', e); } finally { U.userAct = false; } render();
});
// map gestures
const PT = new Map(); let pinch = null, dragMoved = false;
document.addEventListener('pointerdown', e => { if (e.target.id !== 'map') return; e.target.setPointerCapture(e.pointerId); PT.set(e.pointerId, { x: e.clientX, y: e.clientY }); dragMoved = false; if (PT.size === 2) { const [a, b] = [...PT.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: MAPV.z }; } });
document.addEventListener('pointermove', e => {
  if (!PT.has(e.pointerId)) return; const p = PT.get(e.pointerId);
  if (PT.size === 1) { const dx = e.clientX - p.x, dy = e.clientY - p.y; if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true; MAPV.x -= dx / MAPV.z; MAPV.y -= dy / MAPV.z; MAPV.preset = ''; }
  p.x = e.clientX; p.y = e.clientY;
  if (PT.size === 2 && pinch) { const [a, b] = [...PT.values()]; MAPV.z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 60, 40000); dragMoved = true; MAPV.preset = ''; }
});
const endPtr = e => { if (!PT.has(e.pointerId)) return; PT.delete(e.pointerId); if (PT.size < 2) pinch = null; if (!dragMoved && PT.size === 0 && e.type === 'pointerup') { const r = e.target.getBoundingClientRect(); const c = mapHit(e.clientX - r.left, e.clientY - r.top); U.mapCity = c; render(); } };
document.addEventListener('pointerup', endPtr); document.addEventListener('pointercancel', endPtr);
document.addEventListener('wheel', e => { if (e.target.id !== 'map') return; e.preventDefault(); MAPV.z = clamp(MAPV.z * (e.deltaY < 0 ? 1.15 : .87), 60, 40000); MAPV.preset = ''; }, { passive: false });

/* ---------- loop ---------- */
let lastT = performance.now(), uiAcc = 0, saveAcc = 0;
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 300) { S.lastSave = Date.now() - dt * 1000; offlineProgress(); dt = 0; }
  dt = Math.min(dt, 300);
  dt *= S.speed || 1;
  while (dt > 0) { const s = Math.min(.25, dt); step(s); dt -= s; }
  if (U.helpCd > 0) U.helpCd -= (now - (frame.p || now)) / 1000; frame.p = now;
  uiAcc += 1; saveAcc += 1;
  const T = now / 1000;
  const sc = document.getElementById('scene'); if (sc) drawScene(sc, U.tab === 'wh' ? S.warehouses[clamp(U.wh, 0, S.warehouses.length - 1)] : S.warehouses[0], T);
  const mp = document.getElementById('map'); if (mp) drawMap(mp, T);
  requestAnimationFrame(frame);
}
setInterval(render, 220);
setInterval(save, 10000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ---------- boot ---------- */
const loaded = load();
if (loaded) offlineProgress();
ensureMissions();
if (!S.contracts.offers.length) genOffers();
render();
requestAnimationFrame(t => { lastT = t; frame.p = t; requestAnimationFrame(frame); });
window.GLT = { get S() { return S; }, step, render, U, save, load, dispatch, acceptOrder, newGame };
</script>
</body>
</html>
